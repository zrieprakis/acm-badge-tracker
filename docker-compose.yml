services:
  backend:
    # Explicit, stable image name (rather than Compose's default
    # <project-dir-name>-backend) so a `docker save`/`docker load`'d image
    # is recognized as a match regardless of what the folder is named on
    # whatever host runs this - `docker compose up` uses an existing local
    # image under this tag if present, and only falls back to building
    # from the Dockerfile below if it isn't.
    image: acm-badge-tracker-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # In-container path, independent of whatever DB_PATH is set to in
      # .env for local (non-Docker) dev - keeps it aligned with the
      # db-data volume mount below.
      DB_PATH: /app/backend/data/acm-tracker.db
    volumes:
      - db-data:/app/backend/data
    expose:
      - '3001'
    restart: unless-stopped

  frontend:
    image: acm-badge-tracker-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Self-signed cert for speedsupsrvr.hammond.k12.in.us (see nginx.conf).
      # Mounted read-only rather than baked into the image, same reasoning
      # as .env - keeps the private key out of the built image.
      - ./SelfSigned:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
    # Explicit name (otherwise Compose derives <project-dir-name>_db-data)
    # so a helper container can target this volume by a known, stable name
    # regardless of what the folder is named on whatever host runs this -
    # same reasoning as the image tags above.
    name: acm-badge-tracker-db-data
