# Plain HTTP is redirect-only - the app itself is only ever served over HTTPS.
server {
    listen 80;
    server_name speedsupsrvr.hammond.k12.in.us;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name speedsupsrvr.hammond.k12.in.us;

    # Self-signed cert for this app specifically (see SelfSigned/ at the repo
    # root, mounted read-only into this container by docker-compose.yml) -
    # nothing else hosts or terminates TLS for this app.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Client-side routing (react-router) - unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
